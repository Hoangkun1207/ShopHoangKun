<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #1677ff;
            --primary-hover: #0f5ed7;
            --bg: #f3f6fc;
            --card: #fff;
            --text: #172033;
            --muted: #8a96aa;
            --border: #e7edf6;
            --sidebar: #101b2d;
            --sidebar-text: #b9c4d6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 12px;
            --sidebar-width: 280px;
            --shadow: 0 4px 20px rgba(0,0,0,.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        button, input { font-family: inherit; outline: none; border: 0; }
        button { cursor: pointer; }
        a { text-decoration: none; color: inherit; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width); position: fixed; inset: 0 auto 0 0;
            background: linear-gradient(180deg, #0c1627, #101b2d); color: #cbd5e1;
            display: flex; flex-direction: column; z-index: 1000;
        }
        .brand {
            height: 76px; display: flex; align-items: center; padding: 0 25px;
            font-size: 18px; font-weight: 800; color: #fff; border-bottom: 1px solid rgba(255,255,255,.04);
        }
        .sidebar-scroll { flex: 1; overflow-y: auto; padding: 15px 0; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .sb-title {
            color: #60708b; font-size: 10px; font-weight: 800; text-transform: uppercase;
            padding: 13px 22px 9px; letter-spacing: 1px;
        }
        .sb-mi {
            display: flex; align-items: center; padding: 0 15px; margin: 0 10px 4px; height: 42px;
            width: calc(100% - 20px); color: var(--sidebar-text); background: transparent;
            border-radius: 9px; font-size: 14px; font-weight: 700; text-align: left; transition: .2s;
        }
        .sb-mi:hover { background: #17253b; color: #fff; }
        .sb-mi.active {
            background: linear-gradient(90deg, #193e72, #18365f); color: #fff; box-shadow: inset 3px 0 #1681ff;
        }
        .sb-icon { width: 20px; text-align: center; font-size: 15px; margin-right: 14px; }
        .sb-mi .arrow { margin-left: auto; color: #64748b; font-size: 10px; }
        .badge {
            margin-left: auto; background: #0fc58a; color: #fff; padding: 2px 6px;
            border-radius: 5px; font-size: 8px; font-weight: 800;
        }
        .sidebar-footer { padding: 10px 0; border-top: 1px solid rgba(255,255,255,.05); }

        /* MAIN & TOPBAR */
        .main { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar {
            height: 76px; position: sticky; top: 0; z-index: 900; background: #fff;
            border-bottom: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-between; padding: 0 30px;
        }
        .crumb { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; font-weight: 600; }
        .crumb i { font-size: 11px; color: #c4ccda; }
        .crumb strong { color: var(--text); font-weight: 800; }
        .top-right { display: flex; align-items: center; gap: 14px; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 1px solid var(--border);
            color: #526074; font-size: 15px; position: relative; transition: .2s;
        }
        .icon-btn:hover { background: #f5f8fc; color: var(--primary); }
        .dot {
            position: absolute; right: 7px; top: 7px; width: 7px; height: 7px;
            background: var(--danger); border: 2px solid #fff; border-radius: 50%; display: none;
        }
        .lang {
            display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px;
            border: 1px solid var(--border); border-radius: 11px; font-size: 13px; font-weight: 600; color: #526074;
        }
        .lang img { width: 21px; }

        /* USER DROPDOWN */
        .user-dropdown { position: relative; }
        .user {
            height: 44px; padding: 4px 10px 4px 4px; border: 1px solid var(--border);
            border-radius: 24px; background: #fff; display: flex; align-items: center; gap: 9px;
        }
        .avatar {
            width: 35px; height: 35px; border-radius: 50%; display: grid; place-items: center;
            background: linear-gradient(135deg, #d9edff, #b8dcff); color: var(--primary); font-weight: 800;
        }
        .user-name { font-size: 13px; font-weight: 800; color: var(--text); }
        .user i { font-size: 10px; color: #9ba6b8; }
        
        .user-menu {
            position: absolute; right: 0; top: 52px; width: 230px; background: #fff;
            border: 1px solid #e7edf6; border-radius: 14px; padding: 8px;
            box-shadow: 0 12px 35px rgba(0,0,0,.12); opacity: 0; visibility: hidden;
            transform: translateY(-8px); transition: .2s; z-index: 2000;
        }
        .user-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .user-menu-header { display: flex; align-items: center; gap: 10px; padding: 8px; }
        .user-menu-header > div:last-child { display: flex; flex-direction: column; gap: 2px; }
        .user-menu-header strong { font-size: 13px; color: #172033; }
        .user-menu-header span { font-size: 10px; color: #94a0b2; }
        .user-menu-line { height: 1px; background: #edf1f6; margin: 5px 0; }
        .user-menu button {
            width: 100%; height: 38px; display: flex; align-items: center; gap: 10px;
            padding: 0 10px; background: transparent; border-radius: 9px;
            color: #526074; font-size: 12px; font-weight: 700; text-align: left;
        }
        .user-menu button:hover { background: #eef6ff; color: var(--primary); }
        .user-menu button i { width: 18px; text-align: center; }
        .user-menu .logout-item { color: var(--danger); }
        .user-menu .logout-item:hover { background: #fff1f1; color: var(--danger); }

        /* CONTENT */
        .content { padding: 30px; max-width: 1100px; margin: auto; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        .page-title h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .page-title p { color: var(--muted); font-size: 13px; }
        
        .btn-mark-read {
            height: 40px; padding: 0 16px; border-radius: 10px; background: #fff; border: 1px solid var(--border);
            color: #526074; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: .2s;
        }
        .btn-mark-read:hover { background: #f8fafc; color: var(--primary); border-color: #c7ddff; }
        .btn-demo {
            height: 40px; padding: 0 16px; border-radius: 10px; background: var(--primary); border: 1px solid var(--primary);
            color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: .2s; margin-left: 10px;
        }
        .btn-demo:hover { background: var(--primary-hover); }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow: hidden;
        }

        /* NOTIFICATIONS LIST */
        .tabs {
            display: flex; background: #f8fafc; border-bottom: 1px solid var(--border); padding: 0 10px;
        }
        .tab {
            padding: 16px 20px; color: #64748b; font-size: 13px; font-weight: 700; border-bottom: 2px solid transparent; transition: .2s;
        }
        .tab:hover { color: var(--primary); }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        .notif-list { display: flex; flex-direction: column; }
        
        .notif-item {
            display: flex; align-items: flex-start; gap: 15px; padding: 18px 25px;
            border-bottom: 1px solid var(--border); transition: .2s; position: relative;
        }
        .notif-item:last-child { border-bottom: 0; }
        .notif-item:hover { background: #f8fafc; }
        .notif-item.unread { background: #f0f6ff; }
        .notif-item.unread .notif-title { color: #0d1728; }
        .notif-item.unread::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary);
        }

        .notif-icon {
            width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; flex-shrink: 0;
        }
        .icon-system { background: #fff0f3; color: #ff1744; }
        .icon-order { background: #f0f6ff; color: #1677ff; }
        .icon-finance { background: #d1fae5; color: #059669; }

        .notif-content { flex: 1; min-width: 0; }
        .notif-title { font-size: 14px; font-weight: 800; color: #334155; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .notif-text { font-size: 13px; color: #526074; line-height: 1.5; font-weight: 500; }
        .notif-time { font-size: 11px; color: #94a3b8; margin-top: 8px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        .notif-delete {
            width: 32px; height: 32px; border-radius: 8px; background: transparent; color: #cbd5e1;
            display: grid; place-items: center; font-size: 14px; transition: .2s;
        }
        .notif-item:hover .notif-delete { color: #ef4444; background: #ffe2e2; }

        .empty-state {
            padding: 60px 20px; text-align: center; color: #94a3b8; display: none; flex-direction: column; align-items: center;
        }
        .empty-state.show { display: flex; }
        .empty-state i { font-size: 45px; color: #cbd5e1; margin-bottom: 15px; }
        .empty-state h3 { font-size: 16px; color: #475569; margin-bottom: 5px; }

        /* RESPONSIVE */
        @media(max-width:800px) {
            .sidebar { width: 70px; transform: translateX(-100%); transition: .3s; }
            .main { margin-left: 0; }
            .topbar { padding: 0 15px; }
            .lang, .user-name, .crumb span { display: none; }
            .content { padding: 20px 15px; }
            .notif-item { padding: 15px; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .header-actions { display: flex; width: 100%; }
            .header-actions button { flex: 1; justify-content: center; }
        }
    </style>
</head>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAaIOO-6LQs2vZTDBAeJX8piKX4pjfyCbM",
    authDomain: "shophoangkun.firebaseapp.com",
    databaseURL: "https://shophoangkun-default-rtdb.firebaseio.com",
    projectId: "shophoangkun",
    storageBucket: "shophoangkun.firebasestorage.app",
    messagingSenderId: "364993334554",
    appId: "1:364993334554:web:800c66509b355ebf5370a3"
};

if(!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.database();
let currentUser = null;
let notifications = [];
let currentFilter = 'all';

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
    auth.onAuthStateChanged(user => {
        if(!user){
            window.location.href = "index.html";
            return;
        }

        currentUser = user;
        const name = user.displayName || "Thành viên";
        const first = name.charAt(0).toUpperCase();

        document.getElementById("navUserName").innerText = name;
        document.getElementById("menuUserName").innerText = name;
        document.getElementById("avatarMini").innerText = first;
        document.getElementById("menuAvatar").innerText = first;

        loadNotifications();
    });
});

function loadNotifications() {
    db.ref("users/" + currentUser.uid + "/notifications").on("value", snapshot => {
        notifications = [];
        if (snapshot.exists()) {
            snapshot.forEach(child => {
                notifications.push({ id: child.key, ...child.val() });
            });
            // Sắp xếp mới nhất lên đầu
            notifications.sort((a, b) => b.timestamp - a.timestamp);
        }
        renderNotifications();
        updateDot();
    });
}

function renderNotifications() {
    const listEl = document.getElementById("notifList");
    const emptyEl = document.getElementById("emptyState");
    listEl.innerHTML = "";

    const filtered = notifications.filter(n => currentFilter === 'all' || n.type === currentFilter);

    if (filtered.length === 0) {
        emptyEl.classList.add("show");
    } else {
        emptyEl.classList.remove("show");
        filtered.forEach(n => {
            const timeStr = new Date(n.timestamp).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            
            let iconHtml = '';
            if (n.type === 'order') iconHtml = `<div class="notif-icon icon-order"><i class="fa-solid fa-box"></i></div>`;
            else if (n.type === 'finance') iconHtml = `<div class="notif-icon icon-finance"><i class="fa-solid fa-coins"></i></div>`;
            else iconHtml = `<div class="notif-icon icon-system"><i class="fa-solid fa-shield-halved"></i></div>`;

            const item = document.createElement("div");
            item.className = `notif-item ${n.read ? '' : 'unread'}`;
            item.innerHTML = `
                ${iconHtml}
                <div class="notif-content" onclick="markAsRead('${n.id}', ${n.read})" style="cursor: pointer;">
                    <div class="notif-title">
                        <span>${escapeHtml(n.title)}</span>
                    </div>
                    <div class="notif-text">${escapeHtml(n.body)}</div>
                    <div class="notif-time"><i class="fa-regular fa-clock"></i> ${timeStr}</div>
                </div>
                <button class="notif-delete" onclick="deleteNotif('${n.id}')" title="Xóa thông báo">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;
            listEl.appendChild(item);
        });
    }
}

function filterNotif(type, btn) {
    currentFilter = type;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    renderNotifications();
}

function markAsRead(id, currentReadStatus) {
    if (currentReadStatus) return; // Nếu đã đọc thì thôi
    db.ref("users/" + currentUser.uid + "/notifications/" + id).update({ read: true });
}

function markAllAsRead() {
    if (notifications.length === 0) return;
    const updates = {};
    notifications.forEach(n => {
        if (!n.read) {
            updates[n.id + "/read"] = true;
        }
    });
    
    if (Object.keys(updates).length > 0) {
        db.ref("users/" + currentUser.uid + "/notifications").update(updates).then(() => {
            Swal.fire({ toast: true, position: "top-end", icon: "success", title: "Đã đánh dấu tất cả là đã đọc", showConfirmButton: false, timer: 1500 });
        });
    }
}

function deleteNotif(id) {
    db.ref("users/" + currentUser.uid + "/notifications/" + id).remove().then(() => {
        Swal.fire({ toast: true, position: "top-end", icon: "success", title: "Đã xóa thông báo", showConfirmButton: false, timer: 1500 });
    });
}

function updateDot() {
    const hasUnread = notifications.some(n => !n.read);
    const dot = document.getElementById("navDot");
    dot.style.display = hasUnread ? "block" : "none";
}

function createDemoNotification() {
    if (!currentUser) return;
    const types = ['order', 'finance', 'system'];
    const type = types[Math.floor(Math.random() * types.length)];
    let title = "", body = "";

    if (type === 'order') {
        title = "Đơn hàng hoàn thành";
        body = `Đơn hàng mã FB${Date.now().toString().slice(-6)} của bạn đã được xử lý xong.`;
    } else if (type === 'finance') {
        title = "Nạp tiền thành công";
        body = "Bạn vừa được cộng 50.000 VNĐ vào tài khoản.";
    } else {
        title = "Khuyến mãi cuối tuần";
        body = "Nhập mã WEEKEND để được giảm 10% cho mọi dịch vụ. Nhanh tay nào!";
    }

    db.ref("users/" + currentUser.uid + "/notifications").push({
        title: title,
        body: body,
        type: type,
        read: false,
        timestamp: Date.now()
    });
    
    Swal.fire({ toast: true, position: "top-end", icon: "success", title: "Đã tạo thông báo demo", showConfirmButton: false, timer: 1500 });
}

function escapeHtml(value){
    return String(value || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function logout() {
    Swal.fire({
        title: "Đăng xuất?", text: "Bạn có chắc muốn đăng xuất không?", icon: "warning",
        showCancelButton: true, confirmButtonColor: "#1677ff", cancelButtonColor: "#ef4444",
        confirmButtonText: "Đăng xuất", cancelButtonText: "Hủy"
    }).then(result => {
        if(result.isConfirmed) auth.signOut().then(() => window.location.href = "index.html");
    });
}

// User Menu Dropdown Logic
const userBtn = document.getElementById("userBtn");
const userMenu = document.getElementById("userMenu");

userBtn.addEventListener("click", e => { e.stopPropagation(); userMenu.classList.toggle("show"); });
document.addEventListener("click", e => { if (!userMenu.contains(e.target) && !userBtn.contains(e.target)) userMenu.classList.remove("show"); });

</script>
    <script>
/* =========================================================
   HOANGKUN SECURITY SYSTEM
   CHỐNG F12 / CHUỘT PHẢI / DEVTOOLS / VIEW SOURCE
   ========================================================= */

(function () {

    let warningCooldown = false;

    /* =========================
       THÔNG BÁO CẢNH BÁO
    ========================= */
    function securityWarning(message = "Thao tác này không được phép!") {

        // Không spam popup liên tục
        if (warningCooldown) return;

        warningCooldown = true;

        setTimeout(() => {
            warningCooldown = false;
        }, 1800);

        if (typeof Swal !== "undefined") {

            Swal.fire({
                icon: "warning",
                title: "⚠️ CẢNH BÁO BẢO MẬT",
                html: `
                    <div style="
                        text-align:center;
                        color:#64748b;
                        font-size:14px;
                        line-height:1.7;
                    ">
                        <div style="
                            width:65px;
                            height:65px;
                            margin:0 auto 15px;
                            border-radius:50%;
                            background:linear-gradient(135deg,#fff7ed,#ffedd5);
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:30px;
                        ">
                            🔒
                        </div>

                        <b style="color:#ef4444;font-size:15px;">
                            ${message}
                        </b>

                        <p style="margin-top:8px;">
                            Vui lòng không cố gắng truy cập
                            công cụ dành cho nhà phát triển.
                        </p>

                        <div style="
                            margin-top:14px;
                            padding:10px 12px;
                            background:#f8fafc;
                            border:1px solid #e2e8f0;
                            border-radius:10px;
                            font-size:12px;
                        ">
                            🛡️ HoangKun Store Security
                        </div>
                    </div>
                `,
                confirmButtonText: "Đã hiểu",
                confirmButtonColor: "#1677ff",
                width: "420px",
                allowOutsideClick: true,
                allowEscapeKey: true,
                backdrop: "rgba(15,23,42,.78)",
                showClass: {
                    popup: `
                        animate__animated
                        animate__fadeInDown
                    `
                }
            });

        } else {
            alert("⚠️ CẢNH BÁO BẢO MẬT\n\n" + message);
        }
    }


    /* =========================
       CẤM CHUỘT PHẢI
    ========================= */
    document.addEventListener("contextmenu", function (e) {

        e.preventDefault();

        securityWarning(
            "Chuột phải đã bị vô hiệu hóa trên trang này!"
        );

        return false;

    }, true);


    /* =========================
       CẤM F12
    ========================= */
    document.addEventListener("keydown", function (e) {

        const key = e.key.toLowerCase();

        /* F12 */
        if (e.key === "F12" || e.keyCode === 123) {

            e.preventDefault();
            e.stopPropagation();

            securityWarning(
                "Phím F12 đã bị vô hiệu hóa!"
            );

            return false;
        }


        /* =========================
           CTRL + SHIFT + I
           DEVTOOLS
        ========================= */
        if (
            e.ctrlKey &&
            e.shiftKey &&
            key === "i"
        ) {

            e.preventDefault();
            e.stopPropagation();

            securityWarning(
                "Không được phép mở Developer Tools!"
            );

            return false;
        }


        /* =========================
           CTRL + SHIFT + J
           CONSOLE
        ========================= */
        if (
            e.ctrlKey &&
            e.shiftKey &&
            key === "j"
        ) {

            e.preventDefault();
            e.stopPropagation();

            securityWarning(
                "Không được phép mở Console!"
            );

            return false;
        }


        /* =========================
           CTRL + SHIFT + C
           INSPECT ELEMENT
        ========================= */
        if (
            e.ctrlKey &&
            e.shiftKey &&
            key === "c"
        ) {

            e.preventDefault();
            e.stopPropagation();

            securityWarning(
                "Không được phép sử dụng Inspect Element!"
            );

            return false;
        }


        /* =========================
           CTRL + U
           VIEW SOURCE
        ========================= */
        if (
            e.ctrlKey &&
            key === "u"
        ) {

            e.preventDefault();
            e.stopPropagation();

            securityWarning(
                "Không được phép xem mã nguồn trực tiếp!"
            );

            return false;
        }


        /* =========================
           CTRL + S
           SAVE PAGE
        ========================= */
        if (
            e.ctrlKey &&
            key === "s"
        ) {

            e.preventDefault();
            e.stopPropagation();

            securityWarning(
                "Không được phép lưu trang trực tiếp!"
            );

            return false;
        }


        /* =========================
           CTRL + P
           IN / SAVE PDF
        ========================= */
        if (
            e.ctrlKey &&
            key === "p"
        ) {

            e.preventDefault();
            e.stopPropagation();

            securityWarning(
                "Chức năng này đã bị giới hạn!"
            );

            return false;
        }

    }, true);


    /* =========================
       CHẶN KÉO ẢNH
    ========================= */
    document.addEventListener("dragstart", function (e) {

        if (
            e.target &&
            e.target.tagName === "IMG"
        ) {
            e.preventDefault();

            securityWarning(
                "Không được phép kéo hoặc sao chép hình ảnh!"
            );

            return false;
        }

    }, true);


    /* =========================
       CHẶN DOUBLE CLICK
       TRÊN ẢNH
    ========================= */
    document.addEventListener("dblclick", function (e) {

        if (
            e.target &&
            e.target.tagName === "IMG"
        ) {
            e.preventDefault();
        }

    }, true);


    /* =========================
       CHẶN COPY
    ========================= */
    document.addEventListener("copy", function (e) {

        // Cho phép copy trong input/textarea
        const target = e.target;

        if (
            target &&
            (
                target.tagName === "INPUT" ||
                target.tagName === "TEXTAREA"
            )
        ) {
            return;
        }

        e.preventDefault();

        securityWarning(
            "Không được phép sao chép nội dung trang!"
        );

    }, true);


    /* =========================
       CHẶN CUT
    ========================= */
    document.addEventListener("cut", function (e) {

        const target = e.target;

        if (
            target &&
            (
                target.tagName === "INPUT" ||
                target.tagName === "TEXTAREA"
            )
        ) {
            return;
        }

        e.preventDefault();

        securityWarning(
            "Không được phép cắt nội dung trang!"
        );

    }, true);


    /* =========================
       CHẶN CHỌN TEXT
       NHƯNG KHÔNG CHẶN INPUT
    ========================= */
    document.addEventListener("selectstart", function (e) {

        const target = e.target;

        if (
            target &&
            (
                target.tagName === "INPUT" ||
                target.tagName === "TEXTAREA" ||
                target.tagName === "BUTTON"
            )
        ) {
            return;
        }

        // Không cho bôi đen text trang
        e.preventDefault();

    }, true);


    /* =========================
       DEVTOOLS DETECTION
       
       Đây chỉ là lớp phát hiện phía client,
       không phải bảo mật tuyệt đối.
    ========================= */

    let devtoolsShown = false;

    function detectDevTools() {

        const threshold = 160;

        const widthDiff =
            window.outerWidth - window.innerWidth;

        const heightDiff =
            window.outerHeight - window.innerHeight;

        if (
            widthDiff > threshold ||
            heightDiff > threshold
        ) {

            if (!devtoolsShown) {

                devtoolsShown = true;

                securityWarning(
                    "Phát hiện môi trường Developer Tools. Vui lòng đóng công cụ này!"
                );

            }

        } else {

            devtoolsShown = false;

        }

    }

    setInterval(detectDevTools, 1200);


    /* =========================
       CHẶN MENU CHUỘT PHẢI
       TRÊN TOÀN BỘ TRANG
    ========================= */
    window.oncontextmenu = function () {

        securityWarning(
            "Chuột phải đã bị vô hiệu hóa!"
        );

        return false;

    };


    /* =========================
       BẢO VỆ KHI RỜI TRANG
    ========================= */
    window.addEventListener("beforeunload", function () {
        // Không can thiệp nếu trình duyệt tự đóng/tab.
    });


    console.log(
        "%c🛡️ HOANGKUN SECURITY SYSTEM",
        "font-size:20px;font-weight:bold;color:#1677ff;"
    );

    console.log(
        "%c⚠️ Khu vực này dành cho hệ thống.",
        "font-size:14px;color:#ef4444;font-weight:bold;"
    );

})();
</script>
