    <style>
        /* === GLOBAL RESET === */
        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body { background-color: #ffffff; color: #333; overflow-x: hidden; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .col-50 { width: 48%; }
        .col-100 { width: 100%; text-align: center; }

        /* === HIỆU ỨNG HIỆN KHI CUỘN (SCROLL REVEAL) - TỐI ƯU GPU === */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: opacity, transform;
        }
        .reveal.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        /* Nút Bấm Khắp Web & Typewriter */
        .btn-main {
            background: linear-gradient(90deg, #ff4b4b, #fa2828);
            color: #fff; border: none; padding: 12px 35px; font-size: 1.1rem; font-weight: 700;
            border-radius: 30px; cursor: pointer; box-shadow: 0 6px 15px rgba(250, 40, 40, 0.3);
            transition: transform 0.2s, box-shadow 0.2s; 
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 280px; 
            will-change: transform;
        }
        .btn-main:hover { transform: translateY(-3px) !important; box-shadow: 0 8px 20px rgba(250, 40, 40, 0.4); color: #fff; }
        
        .btn-main .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            min-width: 2px;
            background: #fff;
            margin-left: 5px;
            vertical-align: middle;
            animation: blinkCursor 0.7s infinite;
            flex-shrink: 0;
        }
        @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .section-title { font-size: 2.2rem; font-weight: 800; color: #0b1220; margin-bottom: 20px; }
        .section-subtitle { font-size: 1.1rem; color: #555; margin-bottom: 40px; }

        /* === ẢNH MINH HỌA 3D - TỐI ƯU GPU === */
        .graphic-img { 
            width: 100%; 
            max-width: 450px; 
            height: auto; 
            display: block; 
            margin: 0 auto; 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); 
            will-change: transform; 
            transform: translateZ(0); 
        }
        @keyframes floatUpDown { 0%, 100% { transform: translateY(0) translateZ(0); } 50% { transform: translateY(-20px) translateZ(0); } }
        .floating { animation: floatUpDown 4s ease-in-out infinite; }

        /* === 1. HERO SECTION === */
        .hero { padding: 60px 0; background: linear-gradient(to bottom, #ffffff 60%, #f6eff4 100%); }
        .hero-logo { font-size: 2.8rem; font-weight: 800; color: #2b4162; text-transform: uppercase; }
        .hero-line { width: 120px; height: 4px; background-color: #f03e3e; margin: 15px auto 30px auto; border-radius: 2px;}
        .hero .col-50 { text-align: center; }

        /* === 2. FORM ĐĂNG NHẬP (TỐI ƯU GỌN ĐẸP) === */
        .login-section { padding: 60px 0; background-color: #f8fafc; }
        .login-card { background: #fff; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); text-align: left; position: relative; overflow: hidden; border: 1px solid #f1f5f9; }
        .login-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .brand-hk { font-size: 2.2rem; font-weight: 800; color: #2f54eb; letter-spacing: -1px; }
        .brand-hk span { color: #00b4d8; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #334155; font-size: 0.95rem;}
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1.1rem; transition: 0.3s; z-index: 10; }
        .input-wrapper input { width: 100%; padding: 14px 15px 14px 45px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: 0.3s; background: #f8fafc; color: #1e293b; font-size: 1rem; font-weight: 500; }

        .rc-fab { --rc-blue:#2f54eb; --rc-blue-2:#3b5cf0; --rc-blue-deep:#2b48d4; --rc-line:#c3cef7; --rc-shadow:0 10px 26px -8px rgba(47,84,235,.32); position:fixed; right:20px; bottom:30px; z-index:95; display:flex; flex-direction:column; align-items:center; font-family:'Quicksand',sans-serif; }

        .rc-fab.rc-collapsed .rc-stack { opacity:0; transform:translateY(14px) scale(.82); pointer-events:none; }

        .rc-fab.rc-collapsed .rc-main { pointer-events:auto; }
        .rc-label { background:#fff; color:var(--rc-blue); font-weight:800; font-size:14px; padding:9px 18px; border-radius:22px; box-shadow:0 8px 22px -6px rgba(30,41,59,.22); position:relative; white-space:nowrap; }

        .rc-ico:hover { transform:translateY(-3px) scale(1.05); box-shadow:0 16px 30px -8px rgba(47,84,235,.45); }
        .rc-main { position:relative; margin-top:2px; width:60px; height:60px; border:none; cursor:pointer; padding:0; border-radius:19px; background:linear-gradient(160deg,var(--rc-blue-2),var(--rc-blue-deep)); box-shadow:0 12px 28px -8px rgba(47,84,235,.55); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#fff; transition:transform .2s ease, box-shadow .2s ease, filter .2s ease; }

        .rc-main svg { width:24px; height:24px; }

        @media (max-width: 900px) {

        }

<script>
// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAaIOO-6LQs2vZTDBAeJX8piKX4pjfyCbM",
  authDomain: "shophoangkun.firebaseapp.com",
  projectId: "shophoangkun",
  storageBucket: "shophoangkun.firebasestorage.app",
  messagingSenderId: "364993334554",
  appId: "1:364993334554:web:800c66509b355ebf5370a3"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* ================= HIỆU ỨNG NÚT LIÊN HỆ ================= */
(function () {
    var fab = document.getElementById('rcFab');
    var main = document.getElementById('rcMain');
    if (!fab || !main) return;
    
    var open = false;
    main.addEventListener('click', function () {
        open = !open;
        fab.classList.toggle('rc-collapsed', !open);
    });

    document.addEventListener('click', function (e) {
        if (!open) return;
        if (fab.contains(e.target)) return;
        fab.classList.add('rc-collapsed');
        open = false;
    });
})();

/* ================= CHUYỂN ĐỔI FORM ĐĂNG NHẬP / ĐĂNG KÝ ================= */
function toggleForm() {
    const login = document.getElementById("login-box");
    const register = document.getElementById("register-box");
    if (!login || !register) return;

    const showRegister = register.style.display === "none" || !register.style.display;
    login.style.display = showRegister ? "none" : "block";
    register.style.display = showRegister ? "block" : "none";
}

/* ================= ĐĂNG KÝ ================= */
document.getElementById("registerForm")?.addEventListener("submit", async e => {
    e.preventDefault();
    const username = document.getElementById("reg-user").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-pass").value;
    const repass = document.getElementById("reg-repass").value;
    const refcode = document.getElementById("reg-refcode").value.trim();

    if (username.length < 4) return Swal.fire("Lỗi!", "Tên đăng nhập phải có ít nhất 4 ký tự!", "error");
    if (password.length < 6) return Swal.fire("Lỗi!", "Mật khẩu tối thiểu 6 ký tự!", "error");
    if (password !== repass) return Swal.fire("Lỗi!", "Mật khẩu không khớp!", "error");

    Swal.fire({ title: "Đang xử lý...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
        const check = await db.ref("users").orderByChild("ho_ten").equalTo(username).once("value");
        if (check.exists()) return Swal.fire("Lỗi!", "Tên đăng nhập đã tồn tại!", "warning");

        const result = await auth.createUserWithEmailAndPassword(email, password);
        const user = result.user;
        await user.updateProfile({ displayName: username });

        await db.ref("users/" + user.uid).set({
            uid: user.uid, ho_ten: username, email: email,
            ma_gioi_thieu: refcode || "Không có", so_du: 0,
            tong_nap_thang: 0, tong_chi_tieu: 0, don_tao_moi: 0,
            ngay_tao: new Date().toLocaleString("vi-VN")
        });

        await auth.signOut();
        e.target.reset();
        toggleForm();
        Swal.fire("Thành công!", `Tài khoản <b>${username}</b> đã được tạo. Vui lòng đăng nhập!`, "success");
    } catch (error) {
        Swal.fire("Thất bại!", "Email đã được sử dụng hoặc không hợp lệ!", "error");
    }
});

/* ================= ĐĂNG NHẬP ================= */
document.getElementById("loginForm")?.addEventListener("submit", async e => {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-pass").value;

    Swal.fire({ title: "Đang kiểm tra...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
        await auth.signInWithEmailAndPassword(email, password);
        await Swal.fire({ icon: "success", title: "Đăng nhập thành công!", confirmButtonText: "Tiếp tục" });
        window.location.href = "trangchu.html";
    } catch (error) {
        Swal.fire("Lỗi!", "Email hoặc mật khẩu không chính xác!", "error");
    }
});

/* ================= TỰ ĐỘNG CHUYỂN TRANG ================= */
auth.onAuthStateChanged(user => {
    if (user) {
        window.location.href = "trangchu.html";
    }
});

/* ================= SCROLL REVEAL & TYPEWRITER ================= */
const revealObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("in-view"); });
}, { threshold: 0.1 });
document.querySelectorAll(".reveal").forEach(el => revealObserver.observe(el));

document.addEventListener("DOMContentLoaded", function () {
    const typeText = document.getElementById("type-text");
    if (!typeText) return;
    const texts = ["ĐĂNG NHẬP", "ĐĂNG KÝ"];
    let textIndex = 0, charIndex = 0, deleting = false;

    function typeLoop() {
        const currentText = texts[textIndex];
        if (!deleting) {
            typeText.textContent = currentText.slice(0, charIndex + 1);
            charIndex++;
            if (charIndex >= currentText.length) { deleting = true; setTimeout(typeLoop, 1800); return; }
            setTimeout(typeLoop, 100);
        } else {
            typeText.textContent = currentText.slice(0, charIndex - 1);
            charIndex--;
            if (charIndex <= 0) {
                charIndex = 0; deleting = false; textIndex++;
                if (textIndex >= texts.length) textIndex = 0;
                setTimeout(typeLoop, 500); return;
            }
            setTimeout(typeLoop, 60);
        }
    }
    typeText.textContent = "";
    typeLoop();
});
</script>
