<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Giá & Cấp Bậc - HoangKun Store</title>
<style>
:root{
--primary:#2563eb; --primary-soft:#eff6ff; --success:#10b981; --warning:#f59e0b;
--danger:#ef4444; --dark:#111827; --text:#1e293b; --muted:#64748b;
--border:#e2e8f0; --bg:#f8fafc; --card:#ffffff; --radius:16px;
--shadow:0 4px 18px rgba(15,23,42,.05); --sidebar:260px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);position:fixed;left:0;top:0;bottom:0;background:var(--dark);color:#cbd5e1;display:flex;flex-direction:column;z-index:1000}
.brand{height:76px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #263244;font-size:22px;font-weight:800;color:#fff}
.brand span{color:#60a5fa}
.sidebar-scroll{flex:1;overflow:auto;padding:14px 10px}
.menu-title{font-size:11px;font-weight:800;color:#64748b;padding:15px 10px 7px;text-transform:uppercase}
.menu{display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;margin-bottom:4px;border:0;border-radius:10px;background:transparent;color:#cbd5e1;text-align:left;transition:.2s}
.menu:hover{background:#1f2937;color:#fff}
.menu.active{background:var(--primary);color:#fff}
.menu .badge{margin-left:auto;font-size:9px;font-weight:800;padding:3px 6px;border-radius:8px;background:var(--success);color:#fff}
.sidebar-footer{padding:14px 10px;border-top:1px solid #263244}
.main{margin-left:var(--sidebar);width:calc(100% - var(--sidebar));min-height:100vh}
.topbar{height:76px;position:sticky;top:0;z-index:900;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.top-left,.top-right{display:flex;align-items:center;gap:12px}
.mobile-toggle{display:none;border:1px solid var(--border);background:#fff;width:40px;height:40px;border-radius:10px}
.search{width:330px;display:flex;align-items:center;gap:9px;padding:10px 13px;background:#f1f5f9;border:1px solid var(--border);border-radius:10px}
.search input{width:100%;border:0;outline:0;background:transparent}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);background:#fff;border-radius:50%;position:relative;color:#475569}
.user{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border:1px solid var(--border);border-radius:22px;background:#fff}
.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#dbeafe;color:var(--primary);font-weight:800}
.content{padding:24px;max-width:1600px;margin:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.page-head h1{font-size:24px}
.page-head p{margin-top:5px;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 8px;border-radius:8px}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.service{border:1px solid var(--border);border-radius:14px;padding:16px;background:#fff;transition:.2s}
.service:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.service-top{display:flex;justify-content:space-between;gap:10px}
.service-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:#eff6ff;color:#2563eb}
.service h3{font-size:15px;margin:14px 0 6px}
.service p{font-size:12px;color:var(--muted);line-height:1.5}
.service-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px}
.price{font-weight:800;color:#0f172a}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:#475569}
.field input,.field select{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;outline:0;background:#fff;color:var(--text)}
.field input:focus,.field select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}
@media(max-width:1200px){.service-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;width:100%}}
@media(max-width:650px){.service-grid,.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">HOANG<span>KUN</span></div>
        <div class="sidebar-scroll">
            <div class="menu-title">Quản lý chung</div>
            <!-- Nút gọi sang trangchu.html -->
            <button class="menu" onclick="window.location.href='trangchu.html'"><i>⌂</i> Trang tổng quan</button>
            <!-- Nút hiện tại được đánh dấu Active -->
            <button class="menu active" onclick="window.location.href='banggia.html'"><i>◈</i> Bảng giá & Cấp bậc</button>
            
            <button class="menu" onclick="alert('Chức năng đang phát triển!')"><i>▣</i> Đơn hàng</button>
            <button class="menu" onclick="alert('Chức năng đang phát triển!')"><i>◒</i> Thống kê</button>
            
            <div class="menu-title">Tài chính</div>
            <button class="menu" onclick="alert('Chức năng đang phát triển!')"><i>＋</i> Nạp tiền</button>
            
            <div class="menu-title">Tài khoản</div>
            <button class="menu" onclick="alert('Chức năng đang phát triển!')"><i>♙</i> Tài khoản</button>
        </div>
        <div class="sidebar-footer">
            <button class="menu" id="logoutBtn"><i>⇥</i> Đăng xuất</button>
        </div>
    </aside>

    <main class="main">
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="top-left">
                <button class="mobile-toggle" id="mobileToggle">☰</button>
                <div class="search">
                    <span>⌕</span>
                    <input id="globalSearch" placeholder="Tìm dịch vụ...">
                </div>
            </div>
            <div class="top-right">
                <div class="user">
                    <div class="avatar" id="topAvatar">H</div>
                    <span id="topName">Hoangkun</span>
                </div>
            </div>
        </header>

        <div class="content">
            <!-- NỘI DUNG TRANG BẢNG GIÁ -->
            <section class="page">
                <div class="page-head">
                    <div>
                        <h1>Bảng giá & Cấp bậc</h1>
                        <p>Chọn dịch vụ bạn muốn tạo đơn.</p>
                    </div>
                    <div class="actions">
                        <button class="btn btn-secondary" onclick="renderServices()">Đặt lại</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="form-grid">
                        <div class="field">
                            <label>Tìm dịch vụ</label>
                            <input id="serviceSearch" placeholder="Ví dụ: Facebook, TikTok..." oninput="renderServices()">
                        </div>
                        <div class="field">
                            <label>Danh mục</label>
                            <select id="serviceCategory" onchange="renderServices()">
                                <option value="all">Tất cả</option>
                                <option>Facebook</option>
                                <option>Instagram</option>
                                <option>TikTok</option>
                                <option>YouTube</option>
                                <option>Khác</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="service-grid" id="serviceGrid" style="margin-top:18px">
                    <!-- Danh sách dịch vụ sẽ được render qua JS -->
                </div>
            </section>
        </div>
    </main>
</div>

<!-- JAVASCRIPT XỬ LÝ DỊCH VỤ DÀNH RIÊNG CHO TRANG NÀY -->
<script>
    // Dữ liệu dịch vụ (Sản phẩm MS18 được đưa về giá 0đ theo yêu cầu trước đó)
    const services = [
        { id: "MS18", category: "Facebook", name: "Auto tương tác chéo hệ thống", description: "Tăng tương tác tự động theo hệ thống.", price: 0, unit: "1 tương tác" },
        { id: "FB-LIKE", category: "Facebook", name: "Tăng lượt thích bài viết", description: "Dịch vụ tăng lượt thích theo số lượng.", price: 20, unit: "1 like" },
        { id: "FB-FOLLOW", category: "Facebook", name: "Tăng người theo dõi", description: "Tăng follower cho trang cá nhân.", price: 30, unit: "1 follow" },
        { id: "IG-LIKE", category: "Instagram", name: "Instagram Like", description: "Tăng lượt thích bài đăng Instagram.", price: 25, unit: "1 like" },
        { id: "IG-FOLLOW", category: "Instagram", name: "Instagram Follow", description: "Tăng người theo dõi Instagram.", price: 35, unit: "1 follow" },
        { id: "TT-LIKE", category: "TikTok", name: "TikTok Like", description: "Tăng lượt thích video TikTok.", price: 20, unit: "1 like" },
        { id: "TT-FOLLOW", category: "TikTok", name: "TikTok Follow", description: "Tăng follower TikTok.", price: 30, unit: "1 follow" }
    ];

    function money(value) {
        return Number(value || 0).toLocaleString("vi-VN") + "đ";
    }

    function renderServices() {
        const q = (document.getElementById("serviceSearch").value || "").toLowerCase();
        const cat = document.getElementById("serviceCategory").value || "all";
        
        const list = services.filter(s => {
            const matchQ = !q || s.name.toLowerCase().includes(q) || s.category.toLowerCase().includes(q);
            const matchCat = cat === "all" || s.category === cat;
            return matchQ && matchCat;
        });
        
        document.getElementById("serviceGrid").innerHTML = list.map(s => `
            <div class="service">
                <div class="service-top">
                    <div class="service-icon">◈</div>
                    <span class="badge badge-blue">${s.category}</span>
                </div>
                <h3>${s.name}</h3>
                <p>${s.description}</p>
                <div class="service-bottom">
                    <div>
                        <span class="price">${s.price === 0 ? 'Miễn phí' : money(s.price)}</span>
                        <small> / ${s.unit}</small>
                    </div>
                    <button class="btn btn-primary" onclick="alert('Đã chọn: ${s.name}')">Đặt ngay</button>
                </div>
            </div>`
        ).join("") || '<div class="card" style="grid-column:1/-1; text-align:center; padding: 40px; color:#64748b;">Không tìm thấy dịch vụ.</div>';
    }

    // Khởi chạy khi tải trang
    document.addEventListener("DOMContentLoaded", () => {
        renderServices();
        
        // Khôi phục tên User tạm thời nếu có lưu
        let state = JSON.parse(localStorage.getItem("hoangkun_dashboard_v2"));
        if(state && state.user) {
            document.getElementById("topName").textContent = state.user.name;
            document.getElementById("topAvatar").textContent = state.user.name.charAt(0).toUpperCase();
        }
    });
</script>
</body>
</html>
